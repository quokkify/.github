name: Refresh release metadata

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-release-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test metadata updater
        run: python3 -m unittest discover -s tests

      - name: Refresh release ages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release_ages.py

      - name: Commit changed release metadata
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "Release metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "docs: refresh release metadata"
          git push
