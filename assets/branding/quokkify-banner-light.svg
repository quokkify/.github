<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Quokkify — Workflow-forward banner</title>
  <desc id="desc">Quokkify's original amber Q monogram and wordmark beside reusable source modules converging into Template, CI, Dependencies, and Verify stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F3EA"/><stop offset="1" stop-color="#E4F2EA"/></linearGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientTransform="translate(232 205) rotate(90) scale(250)"><stop stop-color="#D99143" stop-opacity=".12"/><stop offset="1" stop-color="#F5B85E" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8EAE1"></stop>
      <stop offset="1" stop-color="#C7DED2"></stop>
    </linearGradient>
    <linearGradient id="q" x1="0.18" y1="0.12" x2="0.82" y2="0.92">
      <stop offset="0" stop-color="#f7c774"></stop>
      <stop offset="1" stop-color="#e58e43"></stop>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e58e43"/><stop offset="1" stop-color="#238b72"/></linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2A65D"/><stop offset="1" stop-color="#9B5E37"/></linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2D9677"/><stop offset="1" stop-color="#236154"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="14" stdDeviation="20" flood-color="#214239" flood-opacity=".18"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2D9677" opacity=".14"/></pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#warm)"/>
  <rect x="548" width="652" height="420" fill="url(#dots)"/>

  <!-- Authoritative original Quokkify emblem, preserved from the remote source. -->
  <g transform="translate(76,101) scale(0.105)" aria-label="Quokkify Q monogram">
    <rect width="1024" height="1024" rx="220" fill="url(#tile)" stroke="#7FAE99" stroke-width="6"></rect>
    <path d="M310 292L266 180Q256 148 292 148H382Q410 148 410 180V270Z" fill="#e58e43"></path>
    <path d="M714 292L758 180Q768 148 732 148H642Q614 148 614 180V270Z" fill="#e58e43"></path>
    <path d="M511 228C306 228 186 365 186 545C186 725 306 844 500 844C580 844 648 824 700 786L790 866L884 760L786 676C814 634 830 589 830 539C830 360 710 228 511 228ZM511 374C614 374 678 441 678 542C678 642 614 704 511 704C408 704 338 642 338 542C338 441 408 374 511 374Z" fill="url(#q)"></path>
    <circle cx="511" cy="538" r="112" fill="#173B32"></circle>
    <path d="M452 542L493 583L579 493" fill="none" stroke="#42d2ad" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="205" y="184" font-size="52" font-weight="800" letter-spacing="-1.8" fill="#173B32">Quokkify</text>
    <text x="208" y="218" font-size="17" font-weight="500" letter-spacing=".25" fill="#3E6E60">Build once. Automate forever.</text>

  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="36" width="636" height="348" rx="24" fill="#EAF5EF"/>
    <rect x="548.75" y="36.75" width="634.5" height="346.5" rx="23.25" fill="none" stroke="#4F947B" stroke-opacity=".24" stroke-width="1.5"/>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="586" y="67" font-size="10" font-weight="800" letter-spacing="1.6" fill="#3E6E60">SOURCE MODULES</text>
    <text x="1148" y="67" text-anchor="end" font-size="10" font-weight="700" letter-spacing="1.4" fill="#5C8B78">BUILD PATH</text>

    <!-- Four stacked source tiles and their converging wires. -->
    <g stroke="#4D8D76" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M650 101H704V196H726"/>
      <path d="M650 167H704V196H726"/>
      <path d="M650 233H704V196H726"/>
      <path d="M650 299H704V196H726"/>
    </g>
    <g fill="#F2A65D"><circle cx="704" cy="101" r="3"/><circle cx="704" cy="167" r="3"/><circle cx="704" cy="233" r="3"/><circle cx="704" cy="299" r="3"/></g>

    <g>
      <g transform="translate(578 73)"><rect width="72" height="56" rx="14" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2"/><rect x="14" y="14" width="44" height="28" rx="5" fill="#F3FBF7" stroke="#2D9677" stroke-width="2"/><rect x="20" y="20" width="13" height="9" rx="2" fill="url(#thumbA)"/><rect x="38" y="20" width="14" height="9" rx="2" fill="url(#thumbB)"/><path d="M21 35H51" stroke="#2D9677" stroke-width="2.5" stroke-linecap="round"/></g>
      <g transform="translate(578 139)"><rect width="72" height="56" rx="14" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2"/><rect x="16" y="12" width="40" height="32" rx="4" fill="#F3FBF7" stroke="#2D9677" stroke-width="2"/><path d="M23 20H49M23 29H49M23 38H42" stroke="#F2A65D" stroke-width="2.5" stroke-linecap="round"/></g>
      <g transform="translate(578 205)"><rect width="72" height="56" rx="14" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2"/><circle cx="25" cy="28" r="9" fill="#F2A65D"/><circle cx="47" cy="28" r="9" fill="#2D9677"/><path d="M30 28H42" stroke="#D7EEE7" stroke-width="2.5" stroke-linecap="round"/></g>
      <g transform="translate(578 271)"><rect width="72" height="56" rx="14" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2"/><path d="M24 18H48V38H24Z" fill="#F3FBF7" stroke="#2D9677" stroke-width="2"/><path d="M28 24H44M28 30H44" stroke="#F2A65D" stroke-width="2.5" stroke-linecap="round"/></g>
    </g>


    <!-- Resulting pipeline: Template / Build -> CI -> Dependencies -> Verify. -->
    <path d="M726 196H738" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M832 196H858M946 196H972M1060 196H1086" fill="none" stroke="#4D8D76" stroke-width="3" stroke-linecap="round"/>
    <circle cx="730" cy="196" r="4" fill="#E58E43"/>
    <path d="M726 189L738 196L726 203Z" fill="#238B72"/>

    <g transform="translate(738 156)"><rect width="94" height="80" rx="18" fill="url(#tile)" stroke="#E58E43" stroke-width="2.5"/><rect x="19" y="17" width="56" height="30" rx="5" fill="#F3FBF7" stroke="#2D9677" stroke-width="2"/><path d="M27 27H44M50 27H67M27 37H63" stroke="#F2A65D" stroke-width="2.5" stroke-linecap="round"/><path d="M25 59H69" stroke="#42D2AD" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(858 156)"><rect x="8" y="22" width="72" height="36" rx="18" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2.5"/><circle cx="25" cy="40" r="3" fill="#2D9677"/><circle cx="34" cy="34" r="3" fill="#2D9677"/><circle cx="34" cy="46" r="3" fill="#2D9677"/><path d="M27.5 38.5L31.5 35.5M27.5 41.5L31.5 44.5" fill="none" stroke="#2D9677" stroke-width="2" stroke-linecap="round"/><text x="56" y="44" text-anchor="middle" fill="#173B32" font-size="11" font-weight="800">CI</text></g>
    <g transform="translate(972 156)"><rect x="8" y="22" width="72" height="36" rx="18" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2.5"/><circle cx="25" cy="40" r="3" fill="#2D9677"/><circle cx="34" cy="34" r="3" fill="#2D9677"/><circle cx="34" cy="46" r="3" fill="#2D9677"/><path d="M27.5 38.5L31.5 35.5M27.5 41.5L31.5 44.5" fill="none" stroke="#2D9677" stroke-width="2" stroke-linecap="round"/><text x="56" y="44" text-anchor="middle" fill="#173B32" font-size="8.5" font-weight="800">Deps</text></g>
    <g transform="translate(1086 156)"><rect x="8" y="22" width="72" height="36" rx="18" fill="#D4E9DF" stroke="#5C9B82" stroke-width="2.5"/><path d="M25 31L32 33V39C32 44 29 48 25 50C21 48 18 44 18 39V33Z" fill="none" stroke="#2D9677" stroke-width="1.8" stroke-linejoin="round"/><path d="M21 39L24 42L29 36" fill="none" stroke="#F2A65D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="44" text-anchor="middle" fill="#173B32" font-size="8.5" font-weight="800">Verify</text></g>

    <g fill="#173B32" font-size="11.5" font-weight="750" text-anchor="middle"><text x="785" y="258">Template / Build</text><text x="902" y="258">CI</text><text x="1016" y="258">Dependencies</text><text x="1130" y="258">Verify</text></g>
    <g fill="#4F7B69" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle"><text x="785" y="276">01</text><text x="902" y="276">02</text><text x="1016" y="276">03</text><text x="1130" y="276">04</text></g>

  </g>
</svg>
