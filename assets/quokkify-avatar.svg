<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Quokkify pixel quokka mark</title>
  <desc id="desc">A friendly pixel-inspired quokka face with an automation checkmark, designed for the Quokkify GitHub organization avatar.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="60" x2="930" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101b19"/>
      <stop offset="1" stop-color="#18302b"/>
    </linearGradient>
    <linearGradient id="fur" x1="270" y1="220" x2="760" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4b860"/>
      <stop offset="1" stop-color="#dc873d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020706" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="216" fill="url(#background)"/>
  <rect x="34" y="34" width="956" height="956" rx="190" fill="none" stroke="#29443e" stroke-width="12"/>

  <!-- restrained automation trail -->
  <path d="M140 758H242M782 758H884" stroke="#2fc2a0" stroke-width="28" stroke-linecap="square" opacity=".82"/>
  <rect x="110" y="728" width="60" height="60" rx="14" fill="#2fc2a0"/>
  <rect x="854" y="728" width="60" height="60" rx="14" fill="#2fc2a0"/>

  <!-- pixel-inspired quokka -->
  <g filter="url(#shadow)">
    <!-- ears -->
    <path d="M248 308V184H376V300Z" fill="#dc873d"/>
    <path d="M648 300V184H776V308Z" fill="#dc873d"/>
    <rect x="282" y="214" width="64" height="94" rx="18" fill="#ffd99b"/>
    <rect x="678" y="214" width="64" height="94" rx="18" fill="#ffd99b"/>

    <!-- head and cheek pixels -->
    <rect x="240" y="278" width="544" height="488" rx="82" fill="url(#fur)"/>
    <rect x="176" y="392" width="96" height="188" rx="34" fill="#e89a4b"/>
    <rect x="752" y="392" width="96" height="188" rx="34" fill="#e89a4b"/>

    <!-- muzzle -->
    <rect x="326" y="492" width="372" height="214" rx="96" fill="#ffd99b"/>
    <rect x="374" y="634" width="276" height="118" rx="54" fill="#ffd99b"/>

    <!-- eyes -->
    <rect x="340" y="408" width="72" height="84" rx="24" fill="#17211f"/>
    <rect x="612" y="408" width="72" height="84" rx="24" fill="#17211f"/>
    <rect x="358" y="424" width="20" height="24" rx="8" fill="#fffaf1"/>
    <rect x="630" y="424" width="20" height="24" rx="8" fill="#fffaf1"/>

    <!-- nose and smile -->
    <path d="M458 526H566V576L512 614L458 576Z" fill="#4d3428"/>
    <path d="M392 622H456L512 668L568 622H632V654L568 714H456L392 654Z" fill="#4d3428"/>
    <path d="M438 632H474L512 660L550 632H586L550 678H474Z" fill="#fffaf1"/>

    <!-- lower pixel shoulders, preserving the old blocky silhouette -->
    <rect x="272" y="720" width="168" height="108" rx="28" fill="#d17a38"/>
    <rect x="584" y="720" width="168" height="108" rx="28" fill="#d17a38"/>
    <rect x="440" y="748" width="144" height="80" rx="24" fill="#e89a4b"/>
  </g>

  <!-- automation confirmation badge -->
  <g transform="translate(716 670)">
    <rect width="172" height="172" rx="54" fill="#2fc2a0" stroke="#101b19" stroke-width="18"/>
    <path d="M42 88L73 119L132 57" fill="none" stroke="#fffaf1" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
